<!DOCTYPE html>
<html class="dark" dir="rtl" lang="ar">
<head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Fahim AI</title>
<script src="https://cdn.tailwindcss.com?plugins=forms"></script>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<script>
tailwind.config = {
    darkMode: 'class',
    theme: {
        extend: {
            colors: {
                surface: '#021427',
                panel: '#0f2034',
                panelStrong: '#1a2b3f',
                panelSoft: '#25364a',
                primary: '#adc7ff',
                accent: '#ef6719',
                text: '#d2e4fe',
                muted: '#c1c6d7'
            },
            fontFamily: {
                body: ['IBM Plex Sans Arabic', 'sans-serif'],
                headline: ['Manrope', 'sans-serif']
            }
        }
    }
};
</script>
<style>
body {
    font-family: 'IBM Plex Sans Arabic', sans-serif;
    background:
        radial-gradient(circle at top, rgba(74, 142, 255, 0.18), transparent 35%),
        linear-gradient(180deg, #021427 0%, #07192c 100%);
}
.material-symbols-outlined {
    font-variation-settings: 'FILL' 0, 'wght' 500, 'GRAD' 0, 'opsz' 24;
}
.signature-gradient {
    background: linear-gradient(135deg, #4a8eff 0%, #005bc0 100%);
}
.custom-scrollbar::-webkit-scrollbar {
    width: 6px;
}
.custom-scrollbar::-webkit-scrollbar-thumb {
    background: rgba(173, 199, 255, 0.24);
    border-radius: 9999px;
}
</style>
</head>
<body class="min-h-screen text-text">
<div class="mx-auto flex min-h-screen max-w-7xl flex-col px-4 py-4 lg:px-6">
<header class="mb-4 flex items-center justify-between rounded-3xl border border-white/10 bg-panel/80 px-5 py-4 backdrop-blur">
<div class="flex items-center gap-3">
<div class="signature-gradient flex h-11 w-11 items-center justify-center rounded-2xl text-white shadow-lg">
<span class="material-symbols-outlined" style="font-variation-settings:'FILL' 1;">psychology</span>
</div>
<div>
<h1 class="font-headline text-xl font-extrabold text-white">Fahim AI</h1>
<p class="text-sm text-muted">محلل المستندات الذكي</p>
</div>
</div>
</header>

<div class="grid flex-1 gap-4 lg:grid-cols-[320px_minmax(0,1fr)]">
<aside class="flex flex-col rounded-3xl border border-white/10 bg-panel/75 p-4 backdrop-blur">
<div class="mb-4">
<h2 class="mb-3 font-headline text-lg font-bold text-primary">إدارة الملفات</h2>
<button class="flex w-full flex-col items-center justify-center rounded-2xl border border-dashed border-primary/40 bg-panelStrong px-4 py-8 text-center transition hover:bg-panelSoft" id="uploadButton" type="button">
<span class="material-symbols-outlined mb-3 rounded-full bg-primary/10 p-3 text-primary">cloud_upload</span>
<span class="text-sm font-semibold text-white">ارفع ملفاً من نوع PDF أو DOCX أو TXT أو PPTX</span>
</button>
<input accept=".pdf,.doc,.docx,.txt,.ppt,.pptx" class="hidden" id="fileInput" type="file">
</div>

<div class="rounded-2xl border border-white/10 bg-panelStrong p-3 text-sm text-muted" id="uploadStatus">
لم يتم رفع أي ملف بعد.
</div>

<div class="mt-4 flex-1 overflow-y-auto custom-scrollbar">
<h3 class="mb-3 px-1 text-xs font-bold uppercase tracking-[0.25em] text-muted">الملفات المرفوعة</h3>
<div class="space-y-3" id="fileList"></div>
</div>
</aside>

<main class="flex min-h-[70vh] flex-col overflow-hidden rounded-3xl border border-white/10 bg-panel/70 backdrop-blur">
<div class="flex-1 overflow-y-auto custom-scrollbar p-5 sm:p-8" id="chatMessages">
<div class="flex max-w-3xl gap-4">
<div class="signature-gradient flex h-10 w-10 shrink-0 items-center justify-center rounded-full text-white shadow-md">
<span class="material-symbols-outlined">smart_toy</span>
</div>
<div class="rounded-3xl rounded-tr-md border border-white/10 bg-panelStrong p-4 shadow-sm">
<p class="leading-7 text-text">مرحباً! ارفع ملفاً ثم اسألني عنه، وسأجيبك اعتماداً على المحتوى المفهرس في الخلفية.</p>
</div>
</div>
</div>

<div class="border-t border-white/10 bg-surface/70 p-4 sm:p-6">
<div class="relative mx-auto max-w-4xl">
<input class="w-full rounded-full border-none bg-panelSoft py-4 pl-24 pr-5 text-base text-white shadow-2xl placeholder:text-muted focus:ring-2 focus:ring-primary/40" id="chatInput" placeholder="اسألني عن محتوى الملف..." type="text">
<div class="absolute left-3 top-1/2 flex -translate-y-1/2 items-center gap-2">
<button class="rounded-full p-2 text-muted transition hover:text-primary" id="secondaryUploadButton" type="button">
<span class="material-symbols-outlined">attach_file</span>
</button>
<button class="signature-gradient flex h-12 w-12 items-center justify-center rounded-full text-white shadow-lg transition hover:scale-105 disabled:cursor-not-allowed disabled:opacity-60" id="sendButton" type="button">
<span class="material-symbols-outlined" style="transform:rotate(180deg);">send</span>
</button>
</div>
</div>
<p class="mt-3 text-center text-xs text-muted">Fahim AI هو نموذج AI وقد يرتكب أخطاء</p>
</div>
</main>
</div>
</div>

<script>
const API_BASE_URL = 'http://127.0.0.1:8000';
const chatInput = document.getElementById('chatInput');
const sendButton = document.getElementById('sendButton');
const uploadButton = document.getElementById('uploadButton');
const secondaryUploadButton = document.getElementById('secondaryUploadButton');
const fileInput = document.getElementById('fileInput');
const chatMessages = document.getElementById('chatMessages');
const uploadStatus = document.getElementById('uploadStatus');
const fileList = document.getElementById('fileList');

let loadingElement = null;

function scrollChatToBottom() {
    chatMessages.scrollTop = chatMessages.scrollHeight;
}

function createIcon(role) {
    const icon = document.createElement('div');
    icon.className = role === 'user'
        ? 'flex h-10 w-10 shrink-0 items-center justify-center rounded-full border border-white/10 bg-panelSoft text-white shadow-sm'
        : 'signature-gradient flex h-10 w-10 shrink-0 items-center justify-center rounded-full text-white shadow-md';

    const symbol = document.createElement('span');
    symbol.className = 'material-symbols-outlined';
    symbol.textContent = role === 'user' ? 'person' : 'smart_toy';
    icon.appendChild(symbol);
    return icon;
}

function appendMessage(role, text) {
    const safeText = typeof text === 'string' && text.trim() ? text : 'No response received.';
    const wrapper = document.createElement('div');
    wrapper.className = role === 'user'
        ? 'mt-6 flex max-w-3xl flex-row-reverse gap-4 self-end'
        : 'mt-6 flex max-w-3xl gap-4';

    const bubble = document.createElement('div');
    bubble.className = role === 'user'
        ? 'signature-gradient rounded-3xl rounded-tl-md p-4 text-white shadow-md'
        : 'rounded-3xl rounded-tr-md border border-white/10 bg-panelStrong p-4 shadow-sm';

    const paragraph = document.createElement('p');
    paragraph.className = role === 'user' ? 'leading-7 text-white' : 'whitespace-pre-wrap leading-7 text-text';
    paragraph.textContent = safeText;

    bubble.appendChild(paragraph);
    wrapper.appendChild(createIcon(role));
    wrapper.appendChild(bubble);
    chatMessages.appendChild(wrapper);
    scrollChatToBottom();
    return wrapper;
}

function appendLoading() {
    const wrapper = document.createElement('div');
    wrapper.className = 'mt-6 flex max-w-3xl gap-4';

    const bubble = document.createElement('div');
    bubble.className = 'rounded-3xl rounded-tr-md border border-white/10 bg-panelStrong p-4 shadow-sm';

    const paragraph = document.createElement('p');
    paragraph.className = 'animate-pulse text-text';
    paragraph.textContent = 'typing...';

    bubble.appendChild(paragraph);
    wrapper.appendChild(createIcon('assistant'));
    wrapper.appendChild(bubble);
    chatMessages.appendChild(wrapper);
    scrollChatToBottom();
    return wrapper;
}

function removeLoading() {
    if (loadingElement) {
        loadingElement.remove();
        loadingElement = null;
    }
}

function setChatPending(isPending) {
    sendButton.disabled = isPending;
    chatInput.disabled = isPending;
}

function setUploadStatus(message, isError = false) {
    uploadStatus.textContent = message;
    uploadStatus.className = isError
        ? 'rounded-2xl border border-red-400/40 bg-red-500/10 p-3 text-sm text-red-300'
        : 'rounded-2xl border border-white/10 bg-panelStrong p-3 text-sm text-muted';
}

function addUploadedFile(filename) {
    const item = document.createElement('div');
    item.className = 'flex items-center justify-between rounded-2xl border border-white/10 bg-panelStrong p-3';

    const info = document.createElement('div');
    info.className = 'min-w-0';

    const name = document.createElement('p');
    name.className = 'truncate text-sm font-semibold text-white';
    name.textContent = filename;

    const badge = document.createElement('span');
    badge.className = 'mt-1 inline-flex rounded-full bg-emerald-500/10 px-2 py-1 text-xs font-medium text-emerald-300';
    badge.textContent = 'تمت المعالجة';

    const icon = document.createElement('span');
    icon.className = 'material-symbols-outlined text-primary';
    icon.textContent = 'description';

    info.appendChild(name);
    info.appendChild(badge);
    item.appendChild(info);
    item.appendChild(icon);
    fileList.prepend(item);
}

async function parseAnswer(response) {
    const rawText = await response.text();
    let data = {};

    try {
        data = rawText ? JSON.parse(rawText) : {};
    } catch (error) {
        console.error('Failed to parse JSON response:', error, rawText);
    }

    console.log('API response:', response.status, data);

    const answer = typeof data.answer === 'string' && data.answer.trim()
        ? data.answer
        : response.ok
            ? 'The server returned an empty answer.'
            : `Request failed with status ${response.status}.`;

    return { answer };
}

async function handleChat() {
    const message = chatInput.value.trim();
    if (!message || sendButton.disabled) {
        return;
    }

    appendMessage('user', message);
    chatInput.value = '';
    setChatPending(true);
    loadingElement = appendLoading();

    try {
        const formData = new FormData();
        formData.append('prompt', message);

        const response = await fetch(`${API_BASE_URL}/chat`, {
            method: 'POST',
            body: formData
            
        });

        const { answer } = await parseAnswer(response);
        removeLoading();
        appendMessage('assistant', answer);
    } catch (error) {
        console.error('Chat request failed:', error);
        removeLoading();
        appendMessage('assistant', 'Unable to reach the server. Please try again.');
    } finally {
        setChatPending(false);
        chatInput.focus();
    }
}

async function handleUpload(file) {
    if (!file) {
        return;
    }

    setUploadStatus(`Uploading ${file.name}...`);

    try {
        const formData = new FormData();
        formData.append('file', file);

        const response = await fetch(`${API_BASE_URL}/upload`, {
            method: 'POST',
            body: formData
        });

        const { answer } = await parseAnswer(response);
        if (!response.ok) {
            throw new Error(answer);
        }

        setUploadStatus(answer);
        addUploadedFile(file.name);
        appendMessage('assistant', `File "${file.name}" is ready. You can ask me about it now.`);
    } catch (error) {
        console.error('Upload request failed:', error);
        const message = error.message || 'Upload failed.';
        setUploadStatus(message, true);
        appendMessage('assistant', message);
    } finally {
        fileInput.value = '';
    }
}

sendButton.addEventListener('click', handleChat);
uploadButton.addEventListener('click', () => fileInput.click());
secondaryUploadButton.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', (event) => handleUpload(event.target.files[0]));
chatInput.addEventListener('keydown', (event) => {
    if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        handleChat();
    }
});
</script>
</body>
</html>
